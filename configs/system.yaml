# DBAS 系统配置（覆盖内置默认值；机器专属路径请勿提交）
# 全部字段可省略，省略即用内置默认。

# 数据管理目录（数据库/报告/临时文件所在），相对项目根
# home: data

# database:
#   path: data/catalog.db

scan:
  batch_size: 20        # 每批最大文件数
  budget_s: 60          # 单次运行时间预算（秒）
  nc_extensions: [".nc", ".nc4", ".cdf"]   # 只有这些后缀进元数据解析队列
  # 盘级全量清单：收录卷内每一个文件，非 netCDF 记为 not_netcdf 条目（可检索、不解析）
  inventory_extensions: ["*"]
  exclude_dirs:                         # 按目录名剪枝的噪声
    - "$RECYCLE.BIN"
    - "System Volume Information"
    - ".Trashes"
    - ".fseventsd"

scheduler:
  # CDS 下载常有 13kB/s 慢流与 IncompleteRead 断连，重试次数给足；长期任务可反复 run 续跑
  max_attempts: 6
  retry_delay_s: 60
  stale_running_s: 600

profile:
  batch_size: 20        # 内容画像单次最多文件数
  budget_s: 120         # 内容画像单次时间预算（秒）

resource:
  # 注意：这是软警戒线而非绝对安全保证，见 docs/operations.md
  max_rss_mb: 3072
  min_available_mb: 1024

log_level: INFO

# 数组层（Zarr 派生）：把 .nc 升维成可切片数组，原始卷仍只读
# 分块方案由查询模式反推（见 src/dbas/zarr_export/store.py 的 TARGET_RULES）：
#   field_series  整场单时刻为主  → time=1，空间整块
#   point_series  单点长时间序列  → 空间 8×8，时间整段
#   area_stats    区域/时间统计   → 空间 32，时间 128
#   level_profile 按气压层剖面    → level=1，时间 24
zarr:
  array_dir: data/arrays     # store 根目录（分析数组层产物卷）
  volume_id: arrays          # 登记进 catalog 的卷 ID
  default_target: field_series
  chunk_elements: 8000000    # 单 chunk 元素上限（压缩前）；8M × f4 ≈ 32MB
  shards: 1                  # 分片倍数：>1 时把 N 个 chunk 合成一个分片文件
  complevel: 4
  consolidate: true
  budget_s: 900
  batch_size: 5
