[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbas"
version = "0.1.0"
description = "DBAS: ERA5 科研数据管理与分析系统（Data Management and Analysis System）"
requires-python = ">=3.11"
# 核心算法库 dbas_core 已内联进 src/dbas_core/（原为独立 git 仓库）。
# 内联理由：原仓库不可访问会导致整个项目无法安装；内联后 clone 即可装，
# 也避免上游默认分支变动悄悄改变科研口径。升级即改本仓源码 + 跑测试。
dependencies = [
    "cftime>=1.6",
    "netCDF4>=1.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
fetch = ["cdsapi>=0.7"]
# subset 需要 xarray/dask 读写 NetCDF 并做区域裁切。
# 科研实验与绘图不在本仓：见 Hydroweave 实验仓。
eda = [
    "xarray>=2024.1",
    "dask[array]>=2024.1",
    "flox>=0.9",
]
# 数组层（.nc → Zarr store）：zarr 3.x 的 codec 与 sharding API 与 v2 不兼容，
# 故下限钉在 3.0；实测版本见 configs/constraints-py313.txt。
zarr = [
    "xarray>=2024.1",
    "dask[array]>=2024.1",
    "zarr>=3.0",
]
dev = ["pytest>=8.0", "ruff>=0.9", "mypy>=1.11", "pytest-cov>=5.0"]

[project.scripts]
dbas = "dbas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
# 规则集刻意保守：只查真实缺陷与可读性问题，不查风格偏好
# （行宽、引号、导入顺序等交给编辑器，避免 CI 因风格噪音长期变红）。
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = [
    # 测试里常常故意写等号比较的字面量在左侧等写法，CI 不应因此变红
    "E501",
]


[tool.mypy]
# 只检查 src（测试里大量 monkeypatch 与假对象，强类型收益低、噪声高）。
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# 存量代码仍是渐进式标注：先保证"已标注之处不出错"，不强制全量注解。
disallow_untyped_defs = false
no_implicit_optional = true

[[tool.mypy.overrides]]
# netCDF4 / cftime / zarr 等科学计算库无 stub，逐一忽略以免噪声淹没真问题
module = ["netCDF4.*", "cftime.*", "zarr.*", "numcodecs.*", "cdsapi.*",
          "plistlib.*", "psutil.*", "flox.*", "dask.*", "xarray.*"]
ignore_missing_imports = true

[tool.coverage.run]
# 只统计业务源码；bin/、scripts/ 与测试不计入
source = ["src/dbas", "src/dbas_core"]
branch = true
omit = [
    "*/__init__.py",
    "*/_version.py",
]

[tool.coverage.report]
# 门槛略低于当前实测值（84%），留出重构余量，但足以拦住"新增代码无测试"。
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
