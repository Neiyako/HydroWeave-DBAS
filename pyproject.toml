[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbas"
version = "0.1.0"
description = "DBAS: ERA5 科研数据管理与分析系统（Data Management and Analysis System）"
requires-python = ">=3.11"
# 核心算法库 dbas_core 已内联进 src/dbas_core/（原为独立 git 仓库）。
# 内联理由：原仓库不可访问会导致整个项目无法安装；内联后 clone 即可装，
# 也避免上游默认分支变动悄悄改变科研口径。升级即改本仓源码 + 跑测试。
dependencies = [
    "cftime>=1.6",
    "netCDF4>=1.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
fetch = ["cdsapi>=0.7"]
# subset 需要 xarray/dask 读写 NetCDF 并做区域裁切。
# 科研实验与绘图不在本仓：见 Hydroweave 实验仓。
eda = [
    "xarray>=2024.1",
    "dask[array]>=2024.1",
    "flox>=0.9",
]
# 数组层（.nc → Zarr store）：zarr 3.x 的 codec 与 sharding API 与 v2 不兼容，
# 故下限钉在 3.0；实测版本见 configs/constraints-py313.txt。
zarr = [
    "xarray>=2024.1",
    "dask[array]>=2024.1",
    "zarr>=3.0",
]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
dbas = "dbas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
# 规则集刻意保守：只查真实缺陷与可读性问题，不查风格偏好
# （行宽、引号、导入顺序等交给编辑器，避免 CI 因风格噪音长期变红）。
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = [
    # 测试里常常故意写等号比较的字面量在左侧等写法，CI 不应因此变红
    "E501",
]

