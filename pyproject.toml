[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbas"
version = "0.1.0"
description = "DBAS: ERA5 科研数据管理与分析系统（Data Management and Analysis System）"
requires-python = ">=3.11"
# dbas-core 钉在已验证的 commit：默认分支变动不会悄悄改变科研口径。
# 升级流程：本地验证 → 改这里的 commit → 重新 pip install -e . → 更新
# configs/constraints-py313.txt 中的版本行。
dependencies = [
    "dbas-core @ git+https://github.com/Neiyako/dbas-core.git@46b32f45de90bb9442df9c04e53c67b7c57b1c3a",
    "netCDF4>=1.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
fetch = ["cdsapi>=0.7"]
# subset 需要 xarray/dask 读写 NetCDF 并做区域裁切。
# 科研实验与绘图不在本仓：见 Hydroweave 实验仓。
eda = [
    "xarray>=2024.1",
    "dask[array]>=2024.1",
    "flox>=0.9",
]
dev = ["pytest>=8.0"]

[project.scripts]
dbas = "dbas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
